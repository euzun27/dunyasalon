name: Bulut yayını

# Kod GitHub'a gönderilince testler geçerse panel.truvapark.com.tr'ye kendiliğinden yayınlanır.
# Gerekli GitHub gizli değeri: CLOUDFLARE_API_TOKEN (Workers ve D1 düzenleme izinli Cloudflare API anahtarı).
on:
  push:
    branches: [main, feature/ilk-surum]
    paths:
      - 'apps/cloud-worker/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'migrations/cloud/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloud.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Cloudflare anahtarı kontrolü
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub gizli değeri tanımlı değil (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Veritabanı güncellemeleri (D1)
        run: npm run db:migrate:remote -w @dunyatek/cloud-worker
      - name: Yayınla
        run: npm run deploy -w @dunyatek/cloud-worker
